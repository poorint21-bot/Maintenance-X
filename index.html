<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12385b"><title>MAINTENANCE X · V1.0 Foundation</title><style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#18324a;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}.layout{display:flex;min-height:100vh}aside{width:270px;flex-shrink:0;background:#12385b;color:white;padding:22px 14px}.brand{font-size:23px;font-weight:850;padding:8px 12px 25px}.brand b{color:#ff9c31}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#dce9f5;text-align:left;padding:13px 12px;border-radius:10px;font:inherit;cursor:pointer}.nav button.active{background:#28629b;color:white}.nav button:disabled{opacity:.5;cursor:not-allowed}main{flex:1;min-width:0;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.language{display:flex;gap:5px}.language button{border:1px solid #c9d9e8;background:white;padding:9px 13px;border-radius:8px;cursor:pointer}.language button.active{background:#12385b;color:white}h1{font-size:28px;margin:28px 0 12px}.panel{background:white;border:1px solid #dfe8f1;border-radius:16px;padding:24px;max-width:950px}.muted{color:#60778d;line-height:1.65}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0}.card{padding:18px;border:1px solid #dfe8f1;border-radius:12px;background:#f9fbfe}.card strong{display:block;font-size:24px;margin-top:9px}.btn{display:inline-block;background:#1763a5;color:white;text-decoration:none;border-radius:10px;padding:12px 16px;margin-top:12px}.note{font-size:12px;color:#677e93}.toggle{display:none}@media(max-width:760px){aside{position:fixed;z-index:5;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;overflow:auto}aside.open{transform:none}.toggle{display:inline-block;background:white;border:1px solid #d4e1ec;border-radius:8px;padding:8px 12px}main{padding:16px}}
</style></head><body><div class="layout"><aside id="sidebar"><div class="brand">MAINTENANCE <b>X</b></div><nav id="nav" class="nav"></nav></aside><main><header class="top"><button class="toggle" id="toggle" aria-label="Toggle menu">☰</button><span class="note">V1.0 · Foundation / Preview</span><div class="language"><button id="th" type="button">TH</button><button id="en" type="button">EN</button></div></header><h1 id="heading"></h1><section class="panel" id="content"></section></main></div><script>
const modules=[{"id": "dashboard", "en": "DASHBOARD", "th": "DASHBOARD", "status": "planned"}, {"id": "pm", "en": "Preventive M", "th": "บำรุงรักษาเชิงป้องกัน", "status": "planned"}, {"id": "cm", "en": "Corrective M", "th": "งานซ่อมแก้ไข", "status": "planned"}, {"id": "pdm", "en": "Predictive M", "th": "บำรุงรักษาเชิงคาดการณ์", "status": "coming_soon"}, {"id": "sparex", "en": "SpareX", "th": "SpareX", "status": "legacy"}, {"id": "asset", "en": "Asset Management", "th": "จัดการเครื่องจักร", "status": "planned"}, {"id": "project", "en": "Project Management", "th": "จัดการโครงการ", "status": "planned"}, {"id": "problem", "en": "Problem Solving", "th": "แก้ไขปัญหา", "status": "planned"}, {"id": "report", "en": "Report", "th": "รายงาน", "status": "planned"}, {"id": "settings", "en": "System Settings", "th": "ตั้งค่าระบบ", "status": "planned"}];
const labels={th:{preview:'โครงสร้าง MAINTENANCE X V1.0 — ยังไม่เชื่อมต่อฐานข้อมูลจริง',planned:'โมดูลนี้อยู่ระหว่างวางโครงสร้าง ยังไม่มีฟังก์ชันบันทึกข้อมูล',legacy:'เปิด SpareX V4.1 ต้นฉบับ (แยกจากระบบใหม่นี้)',legacyWarning:'SpareX เดิมเชื่อมต่อ Supabase จริง การกดยืนยันรายการอาจเปลี่ยนข้อมูลจริง',soon:'รอปรับปรุง',kpis:['PM ที่ครบกำหนด','CM ที่เปิดอยู่','อะไหล่ต่ำกว่า Min','โครงการที่ดำเนินการ'],noData:'—',safe:'ไม่มีการเขียนข้อมูลลง Supabase จากหน้า MAINTENANCE X นี้'},en:{preview:'MAINTENANCE X V1.0 foundation — not connected to live data',planned:'This module is a structural placeholder; no write actions are implemented',legacy:'Open the original SpareX V4.1 (isolated from this new shell)',legacyWarning:'Original SpareX connects to live Supabase; confirming transactions may change real data',soon:'Coming Soon',kpis:['PM Due','CM Open','Low Stock','Active Projects'],noData:'—',safe:'This MAINTENANCE X shell does not write to Supabase'}};
let lang=localStorage.getItem('mx_language')==='en'?'en':'th',active='dashboard';const $=id=>document.getElementById(id);function render(){document.documentElement.lang=lang;['th','en'].forEach(k=>$(k).classList.toggle('active',lang===k));$('nav').replaceChildren();for(let i=0;i<modules.length;i++){const m=modules[i],b=document.createElement('button');b.textContent=`${i+1}. ${m[lang]}${m.status==='coming_soon'?' · '+labels[lang].soon:''}`;b.disabled=m.status==='coming_soon';b.className=active===m.id?'active':'';b.onclick=()=>{active=m.id;$('sidebar').classList.remove('open');render()};$('nav').append(b)}const m=modules.find(x=>x.id===active);$('heading').textContent=m[lang];const c=$('content');c.replaceChildren();let p=document.createElement('p');p.className='muted';p.textContent=labels[lang].preview;c.append(p);if(active==='dashboard'){let cards=document.createElement('div');cards.className='cards';labels[lang].kpis.forEach(t=>{let d=document.createElement('div');d.className='card';let s=document.createElement('span');s.textContent=t;let v=document.createElement('strong');v.textContent='—';d.append(s,v);cards.append(d)});c.append(cards)}else if(active==='sparex'){let a=document.createElement('a');a.className='btn';a.href='./legacy/sparex-v4.1/index.html';a.target='_blank';a.rel='noopener';a.textContent=labels[lang].legacy;c.append(a);let w=document.createElement('p');w.className='muted';w.textContent=labels[lang].legacyWarning;c.append(w)}else{let t=document.createElement('p');t.className='muted';t.textContent=labels[lang].planned;c.append(t)}let foot=document.createElement('p');foot.className='note';foot.textContent=labels[lang].safe;c.append(foot)}$('toggle').onclick=()=>$('sidebar').classList.toggle('open');['th','en'].forEach(k=>$(k).onclick=()=>{lang=k;localStorage.setItem('mx_language',k);render()});render();
</script></body></html>
